# Cache policy by file type. HTML always revalidates so a redeploy shows up at once;
# CSS/JS are referenced as ?v=<version>, so bump the version when they change.
map $uri $cache_control {
  default                               "no-cache";
  ~*\.(?:css|js)$                       "public, max-age=604800";
  ~*\.woff2$                            "public, max-age=31536000, immutable";
  ~*\.(?:svg|png|jpg|jpeg|webp|ico)$    "public, max-age=604800";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  charset_types text/css application/javascript text/plain application/xml image/svg+xml application/manifest+json;
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json application/manifest+json;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # The only inline script is the theme bootstrap in each page's <head>; update its hash if it changes.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-tlwPtPQ9pNnDZamdE6sJdF6cdjnxgWtu8TWxtCTAyc8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
